# Compila el instalador de Windows y lo publica en "Releases".
# Se lanza solo al subir una etiqueta de versión (v0.3.0, v0.3.1…), que crea PUBLICAR.bat
# cuando cambia la versión de package.json. También se puede lanzar a mano desde Actions.
name: Compilar instalador
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/make-icon.mjs
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
