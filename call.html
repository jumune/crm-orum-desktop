<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Llamada · CRM Orum</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,700&display=swap" rel="stylesheet">
<style>
  :root{--slate:#233441;--muted:#5C6E7C;--faint:#93A0AB;--line:#E6EAEE;--bg:#FAFBFC;--soft:#F4F6F8;
        --orange:#FF7932;--orange-deep:#FF5F0B;--orange-soft:#FFECE0;--ok:#2E8B57;--err:#DC2626;
        --grad:linear-gradient(90deg,#FF5F0B,#FF7932);}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--slate);font-family:'Satoshi',system-ui,'Segoe UI',sans-serif;font-size:14px;line-height:1.45;display:flex;flex-direction:column}
  header{padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  header .logo svg{width:28px;height:28px;display:block}
  .wm{font-family:'Clash Display','Satoshi',sans-serif;font-weight:700;letter-spacing:-.01em}
  .who{flex:1;min-width:0}
  .who .n{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .p{font-size:12px;color:var(--muted)}
  .bar{padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
  .rec{display:flex;align-items:center;gap:12px}
  .dot{font-weight:800;color:var(--err);animation:bl 1.2s infinite;visibility:hidden}
  .dot.on{visibility:visible}
  @keyframes bl{50%{opacity:.35}}
  .time{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-left:auto}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--soft);color:var(--muted)}
  .pill.ok{background:#E3F2EA;color:var(--ok)} .pill.err{background:#FCE9E7;color:var(--err)} .pill.warn{background:var(--orange-soft);color:var(--orange-deep)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  select{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid #C7CFD6;border-radius:8px;background:#fff;color:var(--slate);max-width:100%}
  .lv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;font-size:11px;color:var(--muted);font-weight:700}
  .lvb{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:3px}
  .lvb i{display:block;height:100%;width:0;background:var(--grad)}
  .lvb.sys i{background:linear-gradient(90deg,#233441,#3F6EA5)}
  .tx{flex:1;overflow-y:auto;padding:12px 14px}
  .msg{max-width:85%;margin:6px 0;padding:7px 10px;border-radius:10px;background:#fff;border:1px solid var(--line)}
  .msg.com{margin-left:auto;background:var(--orange-soft);border-color:#FFD7C0}
  .msg .w{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:1px}
  .msg.pend{opacity:.55;font-style:italic}
  .empty{color:var(--faint);text-align:center;padding:30px 10px;font-size:13px}
  .note{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
  footer{padding:12px 16px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  button{font:inherit;font-weight:700;border:1px solid transparent;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--soft);color:var(--slate)}
  button.primary{background:var(--grad);color:#fff;flex:1}
  button.ghost{background:transparent;border-color:#C7CFD6}
  button:disabled{opacity:.45;cursor:not-allowed}
  .done{position:fixed;inset:0;background:rgba(250,251,252,.96);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;flex-direction:column;gap:10px}
  .done.show{display:flex}
  .done .big{font-size:20px;font-weight:900}
</style>
</head>
<body>
<header><span class="logo" id="logo"></span><div class="who"><div class="n" id="deal">Llamada</div><div class="p" id="phone"></div></div></header>

<div class="bar">
  <div class="rec">
    <span class="dot" id="dot">● Grabando</span>
    <span class="pill" id="wh">Preparando…</span>
    <span class="time" id="time">00:00</span>
  </div>
  <div class="row">
    <select id="mode" title="Modo de grabación">
      <option value="app">Enlace Móvil · voces separadas</option>
      <option value="manual">Manual · móvil en altavoz</option>
    </select>
    <select id="mic" title="Micrófono"><option value="">Micrófono…</option></select>
    <button class="ghost" id="redial" style="padding:6px 10px;font-size:12.5px">📞 Volver a marcar</button>
  </div>
  <div class="lv">
    <div>🎙 Tú<div class="lvb"><i id="mic-bar"></i></div></div>
    <div id="sys-lbl">🔊 Cliente<div class="lvb sys"><i id="sys-bar"></i></div></div>
  </div>
  <p class="note" id="note"></p>
</div>

<div class="tx" id="tx"><div class="empty">La transcripción aparecerá aquí mientras habláis.</div></div>

<footer>
  <button class="ghost" id="discard">Descartar</button>
  <button class="primary" id="finish" disabled>Terminar y guardar</button>
</footer>

<div class="done" id="done"><div class="big" id="done-t">Guardando…</div><div id="done-s" style="color:var(--muted)"></div><button class="ghost" id="done-close" style="display:none">Cerrar</button></div>

<script src="call.js"></script>
</body>
</html>
